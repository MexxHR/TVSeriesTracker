name: Process Android series request (monitored only)

on:
  workflow_dispatch:
    inputs:
      tmdb_id:
        description: 'TMDB TV ID; no client metadata is trusted'
        required: true
        type: number

concurrency:
  group: monitored-series-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  monitored_update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require main branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: test "$BRANCH" = main
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: python -m unittest discover -s official-data/automation -p 'test_*.py' -q
      - name: Process official sources into monitored staging only
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          TMDB_ID: ${{ inputs.tmdb_id }}
        run: python official-data/automation/update.py --process-discovered "$TMDB_ID"
      - name: Reject production changes
        run: |
          git diff --exit-code -- official-data/official_series_data.json official-data/sources.json official-data/history/changes.jsonl
          git diff --cached --exit-code -- official-data/official_series_data.json official-data/sources.json official-data/history/changes.jsonl
          test -z "$(git ls-files --others --exclude-standard -- official-data/official_series_data.json official-data/sources.json official-data/history/changes.jsonl)"
      - name: Commit monitored registry and audit only
        run: |
          git add -- official-data/monitored_series.json official-data/history/monitored_changes.jsonl
          if git diff --cached --quiet; then
            echo 'Monitored registry unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update monitored series registry'
          git push
