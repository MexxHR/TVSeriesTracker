name: Process Android series request and verified promotion

on:
  workflow_dispatch:
    inputs:
      tmdb_id:
        description: 'TMDB TV ID; no client metadata is trusted'
        required: true
        type: number

concurrency:
  group: official-data-writes
  queue: max
  cancel-in-progress: false

jobs:
  monitored_update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require main branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: test "$BRANCH" = main
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: python -m unittest discover -s official-data/automation -p 'test_*.py' -q
      - name: Process official sources into monitored staging only
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          TMDB_ID: ${{ inputs.tmdb_id }}
        run: python official-data/automation/update.py --process-discovered "$TMDB_ID"
      - name: Promote validated monitored facts
        if: ${{ vars.OFFICIAL_DATA_PROMOTION_ENABLED == 'true' }}
        env:
          TMDB_ID: ${{ inputs.tmdb_id }}
        run: python official-data/automation/update.py --promote-monitored "$TMDB_ID"
      - name: Enforce changed-file allowlist
        env:
          PROMOTION_ENABLED: ${{ vars.OFFICIAL_DATA_PROMOTION_ENABLED }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          allowed = {
              "official-data/monitored_series.json",
              "official-data/history/monitored_changes.jsonl",
              "official-data/official_series_data.json",
              "official-data/history/changes.jsonl",
          }
          tracked = subprocess.check_output(["git", "diff", "--name-only", "--no-renames", "-z", "HEAD"])
          untracked = subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard", "-z"])
          changed = set((tracked + untracked).decode("utf-8").strip("\0").split("\0")) - {""}
          unexpected = sorted(changed - allowed)
          if unexpected:
              print("Unexpected changed files: " + ", ".join(unexpected), file=sys.stderr)
              sys.exit(1)
          if os.getenv("PROMOTION_ENABLED") != "true" and changed & {
              "official-data/official_series_data.json", "official-data/history/changes.jsonl"
          }:
              print("Production data changed while promotion is disabled", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Commit permitted monitored and production data
        run: |
          git add -- official-data/monitored_series.json official-data/history/monitored_changes.jsonl official-data/official_series_data.json official-data/history/changes.jsonl
          if git diff --cached --quiet; then
            echo 'Monitored and production data unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update monitored series registry'
          git push
