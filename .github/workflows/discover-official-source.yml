name: Discover official source (read-only)
on:
  workflow_dispatch:
    inputs:
      tmdb_id:
        description: 'TMDB TV ID to inspect; discovery never writes Official Data'
        required: true
        type: number

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discovery and regression tests
        run: python -m unittest discover -s official-data/automation -p 'test_*.py' -q
      - name: Read-only official-source discovery
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          TMDB_ID: ${{ inputs.tmdb_id }}
        run: python official-data/automation/update.py --discover "$TMDB_ID"
