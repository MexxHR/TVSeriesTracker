name: Verify batch API authentication (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline auth-probe safety regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s official-data/automation -p 'test_batch_auth_probe.py' -q
      - name: Verify auth without snapshot or valid ACK
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SERIES_BATCH_API_URL: ${{ vars.SERIES_BATCH_API_URL }}
          SERIES_BATCH_API_HOST: ${{ vars.SERIES_BATCH_API_HOST }}
          SERIES_BATCH_API_SECRET: ${{ secrets.SERIES_BATCH_API_SECRET }}
        run: python official-data/automation/verify_batch_auth.py
