name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore existing debug signing key when provided
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Test and build debug APK
        env:
          OFFICIAL_DATA_URL: ${{ vars.OFFICIAL_DATA_URL }}
          SERIES_REQUEST_API_BASE_URL: ${{ vars.SERIES_REQUEST_API_BASE_URL }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TVSeriesTracker-V2.6.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TVSeriesTracker-V2.6.0-debug
          path: TVSeriesTracker-V2.6.0-debug.apk
