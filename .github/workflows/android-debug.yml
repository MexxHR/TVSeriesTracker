name: Android debug APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore existing debug signing key when provided
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Test and build debug APK
        env:
          OFFICIAL_DATA_URL: ${{ vars.OFFICIAL_DATA_URL }}
          SERIES_REQUEST_API_BASE_URL: ${{ vars.SERIES_REQUEST_API_BASE_URL }}
        run: ./gradlew clean :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK and package credentials
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          python backend/check_debug_metadata.py app/build/outputs/apk/debug/output-metadata.json
          python backend/package_release.py
          python -c 'from backend.check_apk_signing import certificate_digest; print("APK v2 signer SHA-256:", certificate_digest("app/build/outputs/apk/debug/app-debug.apk"))'
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TV-Series-Tracker-V2.7.14-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Series-Tracker-V2.7.14-debug
          path: TV-Series-Tracker-V2.7.14-debug.apk
          if-no-files-found: error
