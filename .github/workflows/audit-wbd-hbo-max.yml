name: WBD HBO Max Source Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Standard library only. TMDB is optional identity/network metadata only.
      - name: Snapshot protected files
        run: |
          set -euo pipefail
          sha256sum official-data/official_series_data.json official-data/history/changes.jsonl official-data/sources.json official-data/monitored_series.json official-data/history/monitored_changes.jsonl > "$RUNNER_TEMP/wbd-audit-before.sha256"
      - name: Audit infrastructure tests
        run: python -m unittest discover -s official-data/automation -p 'test_wbd_hbo_max_source_audit.py' -q
      - name: WBD HBO Max Source Audit
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: python official-data/automation/wbd_hbo_max_source_audit.py --output "$RUNNER_TEMP/wbd-hbo-max-source-audit.json"
      - name: Verify protected integrity and clean checkout
        if: always()
        run: |
          set -euo pipefail
          sha256sum -c "$RUNNER_TEMP/wbd-audit-before.sha256"
          git diff --exit-code HEAD
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wbd-hbo-max-source-audit
          path: ${{ runner.temp }}/wbd-hbo-max-source-audit.json
          if-no-files-found: error
